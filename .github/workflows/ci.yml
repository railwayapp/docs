name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  CI: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Build Content Collections
        run: pnpm content-collections build

      - name: Build Next.js
        run: pnpm next build
